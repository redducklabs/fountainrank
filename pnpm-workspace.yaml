packages:
  - "web"
  - "mobile"
  - "packages/*"

# Enforce the supply-chain maturity gate on every install, including GitHub-hosted CI.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

overrides:
  # GHSA-52cp-r559-cp3m / GHSA-5p4m-2wfm-xmqj / GHSA-2883-xcg3-v3hh: patched 4.x release is compatible
  # with Redocly and Expo CLI. Remove once all consumers normally resolve >=4.3.2.
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  # GHSA-28wg-ghj8-5hjv / GHSA-2v37-7h3g-55p8: keep Expo's nanoid 3.x
  # consumers on the patched compatible release. Remove once upstream resolves >=3.3.18.
  "nanoid@>=3.0.0 <3.3.18": "3.3.18"
  # GHSA-f88m-g3jw-g9cj / GHSA-rgj7-g3m4-5g8c / GHSA-wq5f-xc86-pv6w: Next's compatible optional range still resolves sharp 0.34.x.
  # Remove once Next normally resolves sharp >=0.35.5.
  sharp: "0.35.5"
  # GHSA-6g55-p6wh-862q / GHSA-r28c-9q8g-f849 / CVE-2026-69153: patched release is compatible with the
  # existing Next, Expo, Tailwind, and Vite PostCSS 8 ranges.
  postcss: "8.5.29"
  # GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g: the patched 4.x release is compatible
  # with Expo CLI's existing browserslist range.
  browserslist: "4.28.7"
  # GHSA-rgw5-rvv9-x895 / GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p: keep each transitive consumer on its compatible major while
  # forcing the patched release for that line. Remove once upstream ranges resolve these.
  "brace-expansion@<1.1.22": "1.1.22"
  "brace-expansion@>=2.0.0 <2.1.8": "2.1.8"
  "brace-expansion@>=4.0.0 <5.0.13": "5.0.13"
  # GHSA-4cwx-7wf7-3272 and the Undici 7.29.x advisories fixed in 7.30.1: jsdom's compatible Undici 7 range predates the fix.
  # Remove once jsdom's normal resolution carries >=7.30.1.
  undici: "7.30.2"
  # xmldom injection/ReDoS advisories (fixed in 0.8.15 / 0.9.12) reach mobile through Expo's
  # plist/config tooling. Keep each consumer on its own line. Remove once Expo resolves these.
  "@xmldom/xmldom@>=0.8.0 <0.8.15": "0.8.15"
  "@xmldom/xmldom@>=0.9.0 <0.9.12": "0.9.12"
  # shell-quote quote() command injection (fixed in 1.11.0), transitive via Expo CLI.
  "shell-quote@>=1.8.4 <1.11.0": "1.12.0"
  # node-forge (eight advisories fixed in 1.4.1), source-map-js GHSA-68fv-2mgg-jv7q and
  # compression GHSA-vc2v-76pw-4v95 are transitive via Expo CLI / Metro; the patched releases
  # are compatible minors. Remove once Expo resolves them normally.
  "node-forge@>=1.0.0 <1.4.1": "1.4.3"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.4"
  "compression@<1.8.2": "1.8.2"
  # GHSA-mrhx-c7xc-m3w5: ESLint's React Hooks plugin accepts zod ^4; force the patched 4.x.
  "zod@>=4.0.0 <4.6.6": "4.6.7"
  # CVE-2026-118764 (minimatch globparts DoS) is fixed only in 11.0.1+. 11.x is a dual
  # CJS/ESM package, so require() consumers keep working. The 10.x consumers are
  # @expo/fingerprint (Minimatch class) and @typescript-eslint/typescript-estree (minimatch());
  # 11.x drops the makeRe/AST exports, which neither uses. Remove once both resolve >=11.0.1.
  "minimatch@>=10.0.0 <11.0.1": "11.0.9"
auditConfig:
  # GHSA-mh99-v99m-4gvg is confined to transitive globbing dependencies. The only published fix
  # is brace-expansion 5.0.8, whose ESM API is incompatible with the minimatch 3/5 consumers still
  # shipped by ESLint and Redocly. Keep their compatible releases until those upstreams migrate.
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
    # Metro uses image-size only in the local/native build toolchain, and the advisories have
    # no patched release. Remove these exceptions when image-size publishes a fix or Expo/Metro
    # drops or patches the dependency.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # GHSA-qr28-fpjm-wq7f (decode-uri-component quadratic DoS): the only fix, 0.5.1, is ESM-only
    # and breaks query-string 7's require(). query-string 7 comes from expo-router 57 (SDK 57);
    # expo-router 58 (SDK 58) no longer depends on it. Deep links are attacker-supplied, but the
    # impact is an on-device DoS of the app only; no server path uses it. Remove with the Expo
    # SDK 58 upgrade.
    - GHSA-qr28-fpjm-wq7f
allowBuilds:
  sharp: true
  unrs-resolver: true
