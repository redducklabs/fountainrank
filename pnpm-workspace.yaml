packages:
  - "web"
  - "mobile"
  - "packages/*"
overrides:
  # Force expo-asset's transitive expo-constants up to the coordinated SDK-56.0.18 patch
  # (~56.0.22 per expo@56.0.18) so pnpm keeps a single copy. Without this, pnpm preserves
  # expo-asset's older compatible resolution and expo-doctor fails the duplicate-native-module
  # check. Revisit/remove on the next Expo SDK bump.
  "expo-asset>expo-constants": "56.0.22"
  # GHSA-52cp-r559-cp3m: Redocly's lockfile resolution predates js-yaml's 4.3.0 fix.
  # Keep this scoped to Redocly; remove once its normal resolution carries >=4.3.0.
  "@redocly/openapi-core>js-yaml": "4.3.0"
  # GHSA-f88m-g3jw-g9cj: Next's compatible optional range still resolves sharp 0.34.x.
  # Remove once Next normally resolves sharp >=0.35.0.
  sharp: "0.35.0"
  # GHSA-6g55-p6wh-862q / GHSA-r28c-9q8g-f849: patched release is compatible with the
  # existing Next, Expo, Tailwind, and Vite PostCSS 8 ranges.
  postcss: "8.5.18"
  # GHSA-rgw5-rvv9-x895: keep each transitive consumer on its compatible major while
  # forcing the patched release for that line. Remove once upstream ranges resolve these.
  "brace-expansion@<1.1.18": "1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4"
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
  # GHSA-4cwx-7wf7-3272: jsdom's compatible Undici 7 range predates the fix.
  # Remove once jsdom's normal resolution carries >=7.29.0.
  undici: "7.29.0"
auditConfig:
  # GHSA-mh99-v99m-4gvg is confined to transitive globbing dependencies. The only published fix
  # is brace-expansion 5.0.8, whose ESM API is incompatible with the minimatch 3/5 consumers still
  # shipped by ESLint and Redocly. Keep their compatible releases until those upstreams migrate.
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
allowBuilds:
  sharp: true
  unrs-resolver: true
