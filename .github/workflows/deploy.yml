name: Deploy

on:
  push:
    tags: ["v*.*.*"] # release TAG push only — never routine pushes to main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build/deploy (defaults to the git SHA)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLUSTER_NAME: fountainrank-production-cluster
  NAMESPACE: fountainrank
  ENVIRONMENT: production
  DOMAIN: fountainrank.com

jobs:
  build-push:
    name: Build + push images
    runs-on: ubuntu-latest # Class B: handles registry credentials
    environment: production
    permissions:
      contents: read
      security-events: write
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    # Single-sourced basemap CDN + style cache-bust — used by BOTH the dark-basemap rollout
    # gate and the web build args below, so the gate verifies the exact URL the client ships.
    # Phase 3a basemap CDN (Terraform `digitalocean_cdn.basemap` endpoint); NEXT_PUBLIC_* are
    # inlined into the web bundle at build time (passed as build-args below).
    # BASEMAP_STYLE_VER: the app requests `style.<flavor>.json?v=$BASEMAP_STYLE_VER`; bump it
    # whenever the style's source/contents change so every client refetches immediately (the
    # CDN ignores the query and returns the object; the browser keys its cache on it).
    env:
      BASEMAP_CDN: fountainrank-basemap.sfo3.cdn.digitaloceanspaces.com
      BASEMAP_STYLE_VER: "2"
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::12}"; fi
          # IMAGE_TAG is reused as a Docker tag AND a k8s label value (backend pod
          # `version` label). Enforce the intersection: a valid k8s label value
          # (<=63 chars, alnum + -._, alnum ends). Tag pushes (v1.2.3) + SHAs pass;
          # a malformed manual workflow_dispatch image_tag fails fast here.
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9._-]{0,61}[A-Za-z0-9])?$'; then
            echo "::error::image_tag '$TAG' is not a valid Docker tag / k8s label value"; exit 1
          fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Registry login
        run: doctl registry login --expiry-seconds 1200
      # Frontend codegen (Python+uv) must run before the web image build, since the
      # web Dockerfile expects packages/api-client/{openapi.json,schema.d.ts} in context.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6.1.1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      - name: Build + push backend
        env:
          REGISTRY: registry.digitalocean.com/${{ vars.DO_REGISTRY }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker build -t "$REGISTRY/fountainrank-backend:$IMAGE_TAG" backend
          docker push "$REGISTRY/fountainrank-backend:$IMAGE_TAG"
      - name: Verify dark basemap style is live (rollout gate)
        # Uses the job-level BASEMAP_CDN + BASEMAP_STYLE_VER, so the gate checks the exact dark
        # style URL the web image (built below) will request (spec §7); fail the deploy if it
        # isn't published.
        run: |
          url="https://${BASEMAP_CDN}/style.dark.json?v=${BASEMAP_STYLE_VER}"
          st=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$url")
          if [ "$st" != "200" ]; then
            echo "::error::dark basemap not live: ${url} -> ${st} (run basemap-upload first)"; exit 1
          fi
          echo "dark basemap style live (${url})."
      - name: Build + push web
        env:
          REGISTRY: registry.digitalocean.com/${{ vars.DO_REGISTRY }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          # BASEMAP_CDN + BASEMAP_STYLE_VER come from the job-level env (single-sourced with the
          # rollout gate above). NEXT_PUBLIC_* are inlined into the web bundle at build time, so
          # they are passed as build-args below.
        run: |
          docker build -f web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL="https://api.${DOMAIN}" \
            --build-arg NEXT_PUBLIC_BASEMAP_STYLE_URL="https://${BASEMAP_CDN}/style.light.json?v=${BASEMAP_STYLE_VER}" \
            --build-arg NEXT_PUBLIC_APP_STORE_URL="https://apps.apple.com/us/app/fountainrank/id6782199873" \
            --build-arg NEXT_PUBLIC_GOOGLE_PLAY_URL="https://play.google.com/store/apps/details?id=com.redducklabs.fountainrank" \
            -t "$REGISTRY/fountainrank-web:$IMAGE_TAG" .
          docker push "$REGISTRY/fountainrank-web:$IMAGE_TAG"
      # Image scans are report-only (ignore-unfixed) — see Task 5's scanning policy.
      - name: Trivy image scan (backend) — report -> SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: registry.digitalocean.com/${{ vars.DO_REGISTRY }}/fountainrank-backend:${{ steps.tag.outputs.image_tag }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          version: v0.71.1
      - name: Upload backend image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-image-backend
      - name: Trivy image scan (web) — report -> SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: registry.digitalocean.com/${{ vars.DO_REGISTRY }}/fountainrank-web:${{ steps.tag.outputs.image_tag }}
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          version: v0.71.1
      - name: Upload web image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-web.sarif
          category: trivy-image-web

  deploy:
    name: Deploy to DOKS
    needs: build-push
    runs-on: ubuntu-latest # Class B: handles cluster + DB credentials
    environment: production
    env:
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
      REGISTRY: registry.digitalocean.com/${{ vars.DO_REGISTRY }}
    steps:
      - uses: actions/checkout@v7
      - uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.1
      # Traefik is the ingress controller (it replaced the retired ingress-nginx; see
      # docs/plans/2026-11-20-ingress-nginx-to-traefik.md). The DO LB forwards to its NodePorts
      # 31080/31443, and it reads the `nginx`-class Ingresses via its Ingress NGINX provider.
      # Traefik trusts X-Forwarded-* only from the cluster's VPC range (the DO LB + nodes), which is
      # only sound while those NodePorts are VPC-only. One script, so every failure path is covered:
      # it resolves + validates the VPC range, checks the node firewalls BEFORE the install, installs,
      # re-checks the live Service + firewalls AFTER, and on ANY failure withdraws the trust from
      # the running Traefik before failing the deploy.
      - name: Install/upgrade Traefik (NodePort 31080/31443)
        run: bash scripts/ci/install-traefik.sh
      # Phase C of the migration: remove the ingress-nginx release, keeping the `nginx`
      # IngressClass. Traefik's provider serves only Ingresses whose class matches an IngressClass
      # with controller k8s.io/ingress-nginx, and that object belongs to the ingress-nginx
      # release, so a plain `helm uninstall` would delete it and Traefik would drop every route.
      # Hand it over with no gap:
      #   1. mark the live object helm.sh/resource-policy=keep,
      #   2. upgrade the release without its IngressClass (Helm skips deleting a live object
      #      marked keep),
      #   3. apply the repo-owned infra/k8s/ingressclass-nginx.yaml,
      #   4. uninstall the release (the IngressClass is no longer in its manifest).
      # After the first run this is a no-op apart from the idempotent IngressClass apply.
      # Whether anything of ingress-nginx is left (the release in ANY state, or its namespace) is
      # read explicitly: a Helm or API error fails the step instead of reading as "absent", and a
      # release mid-operation (pending-*, uninstalling) stops it for diagnosis. The namespace is
      # deleted only once the release and its admission webhook are gone: a webhook left pointing
      # at a deleted Service (failurePolicy Fail) would refuse every Ingress write. While
      # anything is left, and before removing any of it, the live LB must already target Traefik
      # (phase B applied, not just merged): its rules and health check are read from the DO API,
      # and a request for an unknown Host through it must get Traefik's plain-text 404
      # (ingress-nginx answers an HTML page). Removing ingress-nginx while the LB still targets
      # it would be an outage.
      - name: Remove ingress-nginx, keep the nginx IngressClass for Traefik
        run: |
          set -euo pipefail
          listing="$(helm list --all --namespace ingress-nginx --filter '^ingress-nginx$' --output json)"
          releases="$(jq -r 'length' <<<"$listing")"
          case "$releases" in
            0 | 1) ;;
            *) echo "::error::unexpected helm list result: ${releases:0:200}" >&2; exit 1 ;;
          esac
          if [ "$releases" = 1 ]; then
            status="$(jq -r '.[0].status' <<<"$listing")"
            case "$status" in
              deployed | failed) ;;
              *) echo "::error::the ingress-nginx release is '${status:0:50}' (an interrupted Helm operation); diagnose it before removing ingress-nginx" >&2; exit 1 ;;
            esac
          fi
          namespace="$(kubectl get namespace ingress-nginx --ignore-not-found --output name)"
          if [ "$releases" = 1 ] || [ -n "$namespace" ]; then
            cluster_id="$(doctl kubernetes cluster get "$CLUSTER_NAME" --format ID --no-header)"
            lb_ip="$(python3 scripts/ci/traefik_guards.py lb-targets-traefik "$cluster_id")"
            probe="$(curl -sS --max-time 10 -H 'Host: traefik-cutover-probe.invalid' "http://${lb_ip}/")"
            if [ "$probe" != "404 page not found" ]; then
              echo "::error::the load balancer ${lb_ip} does not reach Traefik (unknown-Host probe answered: ${probe:0:200})" >&2
              exit 1
            fi
          fi
          if [ "$releases" = 1 ]; then
            kubectl annotate ingressclass nginx helm.sh/resource-policy=keep --overwrite
            helm upgrade ingress-nginx ingress-nginx               --repo https://kubernetes.github.io/ingress-nginx               --version 4.15.1               --namespace ingress-nginx               --reuse-values               --set controller.ingressClassResource.enabled=false               --wait
            kubectl apply -f infra/k8s/ingressclass-nginx.yaml
            helm uninstall ingress-nginx --namespace ingress-nginx --wait
          fi
          kubectl apply -f infra/k8s/ingressclass-nginx.yaml
          if [ -n "$namespace" ]; then
            webhook="$(kubectl get validatingwebhookconfiguration ingress-nginx-admission --ignore-not-found --output name)"
            if [ -n "$webhook" ]; then
              echo "::error::${webhook} still exists with no ingress-nginx release; remove it through a reviewed change before the namespace (deleting its Service would make it refuse every Ingress write)" >&2
              exit 1
            fi
            kubectl delete namespace ingress-nginx --ignore-not-found
          fi
      - name: Render + apply namespace first
        run: |
          export NAMESPACE ENVIRONMENT IMAGE_TAG REGISTRY DOMAIN
          envsubst < infra/k8s/namespace.yaml | kubectl apply -f -
      # Secrets are passed via env (never interpolated into the shell — DATABASE_CA_CERT
      # is a multiline PEM; URLs can contain shell-significant chars). The CA PEM is
      # written to a temp file and loaded with --from-file so newlines survive intact.
      - name: Create app + registry secrets imperatively
        env:
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
          LOGTO_DB_URL_SECRET: ${{ secrets.LOGTO_DB_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          DO_REGISTRY: ${{ vars.DO_REGISTRY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LOGTO_EMAIL_WEBHOOK_TOKEN: ${{ secrets.LOGTO_EMAIL_WEBHOOK_TOKEN }}
          LOGTO_APP_SECRET: ${{ secrets.LOGTO_APP_SECRET }}
          LOGTO_COOKIE_SECRET: ${{ secrets.LOGTO_COOKIE_SECRET }}
          # Account deletion reuses the already-provisioned Logto M2M app. Per repo convention
          # the app id is a non-sensitive variable; only the secret is a secret.
          LOGTO_MANAGEMENT_APP_ID: ${{ vars.LOGTO_M2M_APP_ID }}
          LOGTO_MANAGEMENT_APP_SECRET: ${{ secrets.LOGTO_M2M_APP_SECRET }}
          GEOCODING_API_KEY: ${{ secrets.GEOCODING_API_KEY }}
          SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          SPACES_REGION: ${{ secrets.SPACES_REGION }}
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
          SPACES_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_KEY }}
          SPACES_SECRET_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' "$DATABASE_CA_CERT" > "$tmp/database-ca.crt"
          if [ -z "$LOGTO_MANAGEMENT_APP_ID" ] || [ -z "$LOGTO_MANAGEMENT_APP_SECRET" ]; then
            echo "vars.LOGTO_M2M_APP_ID and secrets.LOGTO_M2M_APP_SECRET are required for account deletion (DELETE /api/v1/me)" >&2
            exit 1
          fi
          # Spaces (photos) keys are optional until the owner provisions a
          # bucket-create-capable Spaces key (see infra/terraform/main.tf). Only add
          # --from-literal for keys that are actually set: an unset GitHub secret
          # expands to an empty string, and injecting an empty spaces-endpoint would
          # set SPACES_ENDPOINT="" on the backend, which its https-endpoint validator
          # rejects at startup — a crash loop. `optional: true` on the k8s
          # secretKeyRef only skips a *missing* key, not an empty one, so we must
          # omit the key entirely rather than set it empty. Backend fails closed
          # (503 on photo endpoints) when these are absent, never a crash.
          extra=()
          [ -n "$SPACES_ENDPOINT" ] && extra+=(--from-literal=spaces-endpoint="$SPACES_ENDPOINT")
          [ -n "$SPACES_REGION" ] && extra+=(--from-literal=spaces-region="$SPACES_REGION")
          [ -n "$SPACES_BUCKET" ] && extra+=(--from-literal=spaces-bucket="$SPACES_BUCKET")
          [ -n "$SPACES_ACCESS_KEY" ] && extra+=(--from-literal=spaces-access-key="$SPACES_ACCESS_KEY")
          [ -n "$SPACES_SECRET_KEY" ] && extra+=(--from-literal=spaces-secret-key="$SPACES_SECRET_KEY")
          kubectl create secret generic fountainrank-secrets \
            -n "$NAMESPACE" \
            --from-literal=database-url="$DATABASE_URL_SECRET" \
            --from-literal=logto-db-url="$LOGTO_DB_URL_SECRET" \
            --from-literal=google-service-account-json="$GOOGLE_SERVICE_ACCOUNT_JSON" \
            --from-literal=logto-email-webhook-token="$LOGTO_EMAIL_WEBHOOK_TOKEN" \
            --from-literal=logto-app-secret="$LOGTO_APP_SECRET" \
            --from-literal=logto-cookie-secret="$LOGTO_COOKIE_SECRET" \
            --from-literal=logto-management-app-id="$LOGTO_MANAGEMENT_APP_ID" \
            --from-literal=logto-management-app-secret="$LOGTO_MANAGEMENT_APP_SECRET" \
            --from-literal=geocoding-api-key="$GEOCODING_API_KEY" \
            "${extra[@]}" \
            --from-file=database-ca.crt="$tmp/database-ca.crt" \
            --dry-run=client -o yaml | kubectl apply -f -
          doctl registry kubernetes-manifest "$DO_REGISTRY" \
            --name regcred --namespace "$NAMESPACE" | kubectl apply -f -
      - name: Render + apply backend before migrations
        env:
          GOOGLE_DELEGATED_USER: ${{ vars.GOOGLE_DELEGATED_USER }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          LOGTO_APP_ID: ${{ vars.LOGTO_APP_ID }}
          LOGTO_MANAGEMENT_RESOURCE: ${{ vars.LOGTO_MANAGEMENT_RESOURCE }}
          LOGTO_MANAGEMENT_API_BASE_URL: ${{ vars.LOGTO_MANAGEMENT_API_BASE_URL }}
          ADMIN_SUBJECTS: ${{ vars.ADMIN_SUBJECTS }}
        run: |
          export NAMESPACE ENVIRONMENT IMAGE_TAG REGISTRY DOMAIN GOOGLE_DELEGATED_USER FROM_EMAIL LOGTO_APP_ID LOGTO_MANAGEMENT_RESOURCE LOGTO_MANAGEMENT_API_BASE_URL ADMIN_SUBJECTS
          for f in backend; do
            envsubst < "infra/k8s/$f.yaml" | kubectl apply -f -
          done
      # Migrations run before applying web. /readyz is an Alembic schema gate, so the
      # new backend pod reaches Running (/healthz startup probe) but stays NotReady
      # while the DB revision is behind the image head. This single-replica deploy
      # intentionally has a backend outage window during migrations; it avoids old
      # backend code serving against newly migrated data. Select the NEW image's pod
      # by its `version` label (= IMAGE_TAG) so re-deploys never exec the old pod /
      # old image.
      - name: Run DB migrations (before rollout gate)
        run: |
          kubectl -n "$NAMESPACE" wait --for=jsonpath='{.status.phase}'=Running \
            pod -l "app=fountainrank-backend,version=$IMAGE_TAG" --timeout=150s
          POD="$(kubectl -n "$NAMESPACE" get pod \
            -l "app=fountainrank-backend,version=$IMAGE_TAG" \
            -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n "$NAMESPACE" exec "$POD" -- alembic upgrade head
      - name: Render + apply remaining workloads after migrations
        env:
          GOOGLE_DELEGATED_USER: ${{ vars.GOOGLE_DELEGATED_USER }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          LOGTO_APP_ID: ${{ vars.LOGTO_APP_ID }}
          LOGTO_MANAGEMENT_RESOURCE: ${{ vars.LOGTO_MANAGEMENT_RESOURCE }}
          LOGTO_MANAGEMENT_API_BASE_URL: ${{ vars.LOGTO_MANAGEMENT_API_BASE_URL }}
          ADMIN_SUBJECTS: ${{ vars.ADMIN_SUBJECTS }}
        run: |
          export NAMESPACE ENVIRONMENT IMAGE_TAG REGISTRY DOMAIN GOOGLE_DELEGATED_USER FROM_EMAIL LOGTO_APP_ID LOGTO_MANAGEMENT_RESOURCE LOGTO_MANAGEMENT_API_BASE_URL ADMIN_SUBJECTS
          for f in web account-deletion-cleanup logto ingress basemap-tiles; do
            envsubst < "infra/k8s/$f.yaml" | kubectl apply -f -
          done
      # This CronJob queries the write_attempts table introduced by migration 0024. Apply it only
      # after migrations so a deploy at minute :37 cannot schedule the new command against the
      # pre-migration schema.
      - name: Apply write-attempt cleanup after migrations
        run: envsubst < infra/k8s/write-attempt-cleanup.yaml | kubectl apply -f -
      # Removes stale app images from each node (kubelet image GC only starts at 85% disk).
      # The scripts ship as a ConfigMap built from files (NOT envsubst-ed: they use shell
      # variables); the DaemonSet carries their hash so a script change rolls the pods.
      - name: Apply node image cleanup
        run: |
          kubectl -n "$NAMESPACE" create configmap node-image-cleanup-scripts \
            --from-file=infra/node-image-cleanup/ \
            --dry-run=client -o yaml | kubectl apply -f -
          NODE_IMAGE_CLEANUP_SHA="$(find infra/node-image-cleanup -maxdepth 1 -type f | sort | xargs cat | sha256sum | cut -c1-64)"
          export NAMESPACE REGISTRY NODE_IMAGE_CLEANUP_SHA
          envsubst < infra/k8s/node-image-cleanup.yaml | kubectl apply -f -
      - name: Wait for rollouts
        run: |
          kubectl -n "$NAMESPACE" rollout status deploy/fountainrank-backend --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deploy/fountainrank-web --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deploy/logto --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deploy/healthz --timeout=120s
          # basemap-tiles readiness is /planet.json (a real range-read of the archive) — this
          # wait fails the deploy if planet.pmtiles is missing/broken, which is the intended gate.
          kubectl -n "$NAMESPACE" rollout status deploy/basemap-tiles --timeout=180s
          # Last: an ops DaemonSet hiccup must not mask the app rollout results above.
          kubectl -n "$NAMESPACE" rollout status ds/node-image-cleanup --timeout=120s
